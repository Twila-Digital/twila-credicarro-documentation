openapi: 3.1.0
info:
  title: API Credicarro
  description: API para gerenciamento de cobranças e pagamentos usando o Credicarro.
  version: 1.0.0
servers:
  - url: https://api.staging.credicarro.com.br/integration
    description: Servidor para o ambiente de staging
paths:
  /v1/proposal:
    post:
      tags:
        - Proposta
      summary: Criar uma nova proposta
      description: Cria uma nova proposta a partir de uma simulação existente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Os dados da sua proposta
              required: ['cpf', 'simulacaoId']
              additionalProperties: false
              properties:
                cpf:
                  minLength: 11
                  type: string
                  description: CPF do cliente **somente números** (11 dígitos).
                  example: "12345678901"
                simulacaoId:
                  type: string
                  format: uuid
                  description: Identificador único da simulação
                  example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
      responses:
        '201':
          description: Proposta criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_proposta:
                    type: string
                    format: uuid
                    description: Identificador único da proposta
                    example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    get:
      tags:
        - Proposta
      summary: Paginação de propostas
      description:  Paginação de propostas
      security:
        - bearerAuth: []
      parameters:
        - name: pagina_inicial
          in: query
          description: Página inicial (mínimo 1)
          schema:
            type: integer
            format: int32
            example: 1
        - name: limite
          in: query
          description: Quantidade de itens por página (1 a 100)
          schema:
            type: integer
            format: int32
            example: 10
      responses:
        '200':
          description: Lista de propostas retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    description: Lista de propostas
                    items:
                      $ref: "#/components/schemas/ProposalResponse"
                  pagina:
                    $ref: "#/components/schemas/Page"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/{propostaId}:
    get:
      tags:
        - Proposta
      summary: Consultar proposta pelo ID.
      description: Consulta os detalhes de uma proposta específica utilizando o seu ID
      security:
        - bearerAuth: []
      parameters:
        - name: propostaId
          in: path
          description: Identificador único da proposta (UUID) retornado na criação da proposta
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único da proposta
            example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
      responses:
        '200':
          description: Proposta retornada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation/range/refinancing:
    get:
      tags:
        - Proposta
      summary: Consultar valor mínimo e máximo refinanciável
      description: Consulta o valor mínimo e máximo refinanciável pela placa informada
      security:
        - bearerAuth: []
      parameters:
        - name: placa
          in: query
          description: Placa do veículo para busca
          required: true
          schema:
            type: string
            minLength: 7
            example: ABC-1234 ou ABC1D23
            description: Placa do veículo
      responses:
        '200':
          description: Faixa de valor refinanciavel
          content:
            application/json:
              schema:
                type: object
                properties:
                  opcoes_por_prazo:
                    type: array
                    items:
                      type: object
                      properties:
                        prazo:
                          type: integer
                          format: int32
                          description: Prazo
                          example: 6
                        valor_minimo_refinanciavel:
                          type: number
                          format: double
                          description: Mínimo valor refinanciavel
                          example: 12480
                        valor_maximo_refinanciavel:
                          type: number
                          format: double
                          description: Máximo valor refinanciavel
                          example: 35720
                      additionalProperties: false
                    nullable: true
                additionalProperties: false
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation:
    get:
      tags:
        - Proposta
      summary: Paginação de simulações
      description: Paginação de simulações
      security:
        - bearerAuth: []
      parameters:
        - name: pagina_inicial
          in: query
          description: Página inicial (mínimo 1)
          schema:
            type: integer
            format: int32
            example: 1
        - name: limite
          in: query
          description: Quantidade de itens por página (1 a 100)
          schema:
            type: integer
            format: int32
            example: 10
      responses:
        '200':
          description: Lista de simulações retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    description: Lista de simulações
                    items:
                      $ref: "#/components/schemas/SimulationResponse"
                  pagina:
                    $ref: "#/components/schemas/Page"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation/{simulacaoId}:
    get:
      tags:
        - Proposta
      summary: Consultar simulação pelo ID.
      description: Consulta os detalhes de uma simulação específica utilizando o seu ID
      security:
        - bearerAuth: []
      parameters:
        - name: simulacaoId
          in: path
          description: Identificador único da simulaçao (UUID) retornado na criação da simulaçao
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único da simulaçao
            example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
      responses:
        '200':
          description: Simulaçao retornada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResponse"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation/financing:
    post:
      tags:
        - Proposta
      summary: Criar uma nova simulação de financiamento
      description: Cria uma nova simulação de financiamento
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Os dados da sua simulação
              required: ['cpf', 'isVeiculoZeroKm', 'placa', 'valorSolicitado', 'uf', 'valorEntrada']
              additionalProperties: false
              properties:
                cpf:
                  minLength: 11
                  type: string
                  description: CPF do cliente **somente números** (11 dígitos)
                  example: "12345678901"
                isVeiculoZeroKm:
                  type: boolean
                  description: Indica se o veículo é zero quilômetro. true para novo, false para usado.
                  example: true
                placa:
                  type: string
                  description: Placa do veículo
                  example: ABC1D23
                valorSolicitado:
                  type: number
                  description: Valor total solicitado para financiamento
                  format: double
                  example: 45000
                uf:
                  type: string
                  description: UF (Unidade Federativa) do registro do veículo, em formato de 2 letras (ex. SP, RJ, MG). Campo opcional
                  example: "SP"
                valorEntrada:
                  type: number
                  description: Valor de entrada do financiamento, em reais. Utilize ponto como separador decimal. Campo opcional
                  format: double
                  example: 45000
      responses:
        '201':
          description: Simulação criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulacoes:
                    type: array
                    items:
                      type: object
                      properties:
                        id_simulacao:
                          type: string
                          format: uuid
                          example: 123e4567-e89b-12d3-a456-426614174000
                        valor_solicitado:
                          type: number
                          format: double
                          example: 1
                        prazo:
                          type: integer
                          format: int32
                          example: 1
                        valor_parcela:
                          type: number
                          format: double
                          example: 1
                        valor_tac:
                          type: number
                          format: double
                          example: 1
                        valor_boleto:
                          type: number
                          format: double
                          example: 1
                        valor_seguro:
                          type: number
                          format: double
                          example: 1
                        valor_iof:
                          type: number
                          format: double
                          example: 1
                        percentual_iof:
                          type: number
                          format: double
                          example: 1
                        valor_credito_total:
                          type: number
                          format: double
                          example: 1
                        valor_divida_total:
                          type: number
                          format: double
                          example: 1
                        percentual_cet_mensal:
                          type: number
                          format: double
                          example: 1
                        percentual_cet_anual:
                          type: number
                          format: double
                          example: 1
                        percentual_juros_mensal:
                          type: number
                          format: double
                          example: 1
                        percentual_juros_anual:
                          type: number
                          format: double
                          example: 1
                        valor_retencao_diaria_aproximado:
                          type: number
                          format: double
                          nullable: true
                          example: null
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation/refinancing:
    post:
      tags:
        - Proposta
      summary: Criar uma nova simulação de refinanciamento
      description: Cria uma nova simulação de refinanciamento
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Os dados da sua simulação
              required: ['placa', 'valorSolicitado', 'cpf']
              additionalProperties: false
              properties:
                cpf:
                  minLength: 11
                  type: string
                  description: CPF do cliente **somente números** (11 dígitos)
                  example: "12345678901"
                placa:
                  minLength: 1
                  type: string
                  description: Placa do veículo
                  example: ABC1D23
                valorSolicitado:
                  type: number
                  description: Valor total solicitado para refinanciamento
                  format: double
                  example: 45000
      responses:
        '201':
          description: Simulação criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulacoes:
                    type: array
                    items:
                      type: object
                      properties:
                        id_simulacao:
                          type: string
                          format: uuid
                          example: 123e4567-e89b-12d3-a456-426614174000
                        valor_solicitado:
                          type: number
                          format: double
                          example: 1
                        prazo:
                          type: integer
                          format: int32
                          example: 1
                        valor_parcela:
                          type: number
                          format: double
                          example: 1
                        valor_tac:
                          type: number
                          format: double
                          example: 1
                        valor_boleto:
                          type: number
                          format: double
                          example: 1
                        valor_seguro:
                          type: number
                          format: double
                          example: 1
                        valor_iof:
                          type: number
                          format: double
                          example: 1
                        percentual_iof:
                          type: number
                          format: double
                          example: 1
                        valor_credito_total:
                          type: number
                          format: double
                          example: 1
                        valor_divida_total:
                          type: number
                          format: double
                          example: 1
                        percentual_cet_mensal:
                          type: number
                          format: double
                          example: 1
                        percentual_cet_anual:
                          type: number
                          format: double
                          example: 1
                        percentual_juros_mensal:
                          type: number
                          format: double
                          example: 1
                        percentual_juros_anual:
                          type: number
                          format: double
                          example: 1
                        valor_retencao_diaria_aproximado:
                          type: number
                          format: double
                          nullable: true
                          example: null
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/authentication/accesstoken:
    post:
      tags:
        - Autenticação
      summary: Gerar token de acesso.
      description: Gera um token de acesso para o parceiro utilizando as credenciais do cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  description: Identificador do cliente de integração fornecido pelo Credicarro
                  example: 8pqh3k1y0zmtg4u9xenrcvlsw2
                clientSecret:
                  type: string
                  description: Segredo do cliente de integração fornecido pelo Credicarro
                  example: 8qzn2v0w5lgyh3cmt9a7jrk1f4bepsdu6xovifn3t5hlgq7r9kc
              required:
                - clientId
                - clientSecret
      responses:
        '200':
          description: autenticação retornada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/authenticationResponse"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/customer:
    post:
      tags:
        - Cliente
      summary: Criar um novo cliente
      description: Cria um novo cliente com base nos dados fornecidos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Dados do novo cliente
              required: ['celular', 'cpf', 'dataDeNascimento', 'email', 'nome', 'sobrenome']
              additionalProperties: false
              properties:
                celular:
                  type: string
                  minLength: 1
                  description: Telefone celular no formato E.164 (código do país + DDD + número).
                  example: "+55 (11) 99876-5432"
                cpf:
                  type: string
                  minLength: 1
                  maxLength: 11
                  description: CPF do cliente **somente números** (11 dígitos).
                  example: "12345678901"
                dataDeNascimento:
                  type: string
                  format: date-time
                  description: Data de nascimento em formato ISO-8601.
                  example: "1990-05-20T00:00:00-03:00"
                email:
                  type: string
                  minLength: 1
                  description: Endereço de e-mail do cliente.
                  example: "maria.souza@exemplo.com.br"
                nome:
                  type: string
                  minLength: 1
                  description: Primeiro nome do cliente.
                  example: "Maria"
                sobrenome:
                  type: string
                  minLength: 1
                  description: Sobrenome do cliente.
                  example: "Souza"
      responses:
        '201':
          description: Cliente criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_cliente:
                    type: string
                    format: uuid
                    description: Identificador único do cliente
                    example: 123e4567-e89b-12d3-a456-426614174000
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/customer/address:
    post:
      tags:
        - Cliente
      summary: Criar ou atualizar endereço de um cliente
      description: Cria ou atualiza o endereço de um cliente com base nos dados fornecidos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Dados para criação ou atualização de endereço
              required: ['cpf', 'endereco']
              additionalProperties: false
              properties:
                cpf:
                  type: string
                  minLength: 11
                  maxLength: 11
                  description: CPF do cliente **somente números** (11 dígitos).
                  example: "12345678901"
                endereco:
                  type: object
                  required: ['rua', 'cidade', 'estado', 'bairro', 'cep', 'pais']
                  additionalProperties: false
                  properties:
                    rua:
                      type: string
                      description: Nome da rua.
                      example: "Av. Paulista"
                    cidade:
                      type: string
                      description: Cidade.
                      example: "São Paulo"
                    estado:
                      type: string
                      description: Estado.
                      example: "SP"
                    bairro:
                      type: string
                      description: Bairro.
                      example: "Bela Vista"
                    cep:
                      type: string
                      description: CEP (somente números).
                      example: "01311000"
                    pais:
                      type: string
                      description: País.
                      example: "Brasil"
                    numero:
                      type: string
                      description: Número do endereço (opcional).
                      example: "1578"
                    complemento:
                      type: string
                      description: Complemento (opcional).
                      example: "Bloco B, Apto 1203"
      responses:
        '202':
          description: Endereço aceito para criação ou atualização
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/customer/professional:
    post:
      tags:
        - Cliente
      summary: Criar ou atualizar dados profissionais de um cliente
      description: Cria ou atualiza as informações profissionais de um cliente com base nos dados fornecidos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Dados profissionais do cliente
              required: ['cpf', 'tipoOcupacao', 'renda']
              additionalProperties: false
              properties:
                cpf:
                  type: string
                  minLength: 11
                  maxLength: 11
                  description: CPF do cliente **somente números** (11 dígitos).
                  example: "12345678901"
                tipoOcupacao:
                  type: integer
                  format: int32
                  description: |
                    Tipo de ocupação do cliente.
                    Valores aceitos:
                      - 1 = aposentado
                      - 2 = pensionista
                      - 3 = assalariado
                      - 4 = autônomo
                      - 6 = freelancer
                      - 7 = proprietário
                  example: 1
                renda:
                  type: number
                  format: double
                  description: Renda mensal do cliente, em reais (use ponto como separador decimal).
                  example: 6500.00
      responses:
        '202':
          description: Dados profissionais aceitos para criação ou atualização
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/customer/unified:
    post:
      tags:
        - Cliente
      summary: Criar ou atualizar cliente com dados completos
      description: Cria ou atualiza um cliente incluindo informações pessoais, endereço e dados profissionais.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Dados completos do cliente
              required: ['celular', 'cpf', 'dataDeNascimento', 'email', 'nome', 'sobrenome', 'endereco', 'dadosProfissionais']
              additionalProperties: false
              properties:
                celular:
                  type: string
                  minLength: 1
                  description: Telefone celular no formato E.164 (código do país + DDD + número).
                  example: "+55 (11) 99876-5432"
                cpf:
                  type: string
                  minLength: 11
                  maxLength: 11
                  description: CPF do cliente **somente números** (11 dígitos).
                  example: "12345678901"
                dataDeNascimento:
                  type: string
                  format: date-time
                  description: Data de nascimento em formato ISO-8601.
                  example: "1990-05-20T00:00:00-03:00"
                email:
                  type: string
                  minLength: 1
                  description: Endereço de e-mail do cliente.
                  example: "maria.souza@exemplo.com.br"
                nome:
                  type: string
                  minLength: 1
                  description: Primeiro nome do cliente.
                  example: "Maria"
                sobrenome:
                  type: string
                  minLength: 1
                  description: Sobrenome do cliente.
                  example: "Souza"
                endereco:
                  type: object
                  required: ['rua', 'cidade', 'estado', 'bairro', 'cep', 'pais']
                  properties:
                    rua:
                      type: string
                      example: "Av. Paulista"
                    cidade:
                      type: string
                      example: "São Paulo"
                    estado:
                      type: string
                      example: "SP"
                    bairro:
                      type: string
                      example: "Bela Vista"
                    cep:
                      type: string
                      example: "01311000"
                    pais:
                      type: string
                      example: "Brasil"
                    numero:
                      type: string
                      example: "1578"
                    complemento:
                      type: string
                      example: "Bloco B, Apto 1203"
                dadosProfissionais:
                  type: object
                  required: ['tipoOcupacao', 'renda']
                  properties:
                    tipoOcupacao:
                      type: integer
                      format: int32
                      description: |
                        Tipo de ocupação do cliente.
                        Valores aceitos:
                          - 1 = aposentado
                          - 2 = pensionista
                          - 3 = assalariado
                          - 4 = autônomo
                          - 6 = freelancer
                          - 7 = proprietário
                      example: 1
                    renda:
                      type: number
                      format: double
                      description: Renda mensal do cliente em reais.
                      example: 6500.00
      responses:
        '201':
          description: Cliente criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_cliente:
                    type: string
                    format: uuid
                    description: Identificador único do cliente
                    example: 123e4567-e89b-12d3-a456-426614174000
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    SimulationResponse:
      type: object
      description: Os dados da sua simulação
      properties:
        id_simulacao:
          type: string
          format: uuid
          description: Identificador único da simulação
          example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
        prazo:
          type: integer
          format: int64
          description: Prazo da simulação
          example: 24
        valor_parcela:
          type: number
          format: double
          description: Valor da parcela
          example: 2356
        valor_solicitado:
          type: number
          format: double
          description: Valor solicitado
          example: 37908
        valor_entrada:
          type: number
          format: double
          description: Valor de entrada
          example: 9786
        valor_bem:
          type: number
          format: double
          description: Valor do bem
          example: 47694
        valor_tac:
          type: number
          format: double
          description: Valor da taxa de cadastro
          example: 1500
        taxa_juros_negociada:
          type: number
          format: double
          description: Valor da taxa de juros
          example: 2.79
        valor_registro:
          type: number
          format: double
          description: Valor do registro
          example: 487
        uf:
          type: string
          maxLength: 2
          description: Estado da simulação
          example: "SP"
        tipo:
          type: string
          description: Tipo da proposta utilizada
