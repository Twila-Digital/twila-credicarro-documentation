                renavam:
                  type: string
                  description: Renavam do veículo (11 dígitos).
                  example: "12345678901"
                chassi:
                  type: string
                  description: Chassi do veículo.
                  example: 9BWZZZ377VT004251
                placa:
                  type: string
                  description: Placa do veículo.
                  example: ABC1D23
                cor:
                  type: string
                  description: Cor do veículo (não pode conter números).
                  example: PRATA
      responses:
        '202':
          description: Dados do veículo aceitos
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
