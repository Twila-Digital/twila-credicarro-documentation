  /v2/proposal/simulation/financing:
    post:
      tags:
        - Proposta
      summary: Criar uma nova simulação de financiamento
      description: |
        Cria uma nova simulação de financiamento selecionando a loja de integração pelo CNPJ (`cnpjLoja`).
        A loja precisa estar vinculada ao parceiro autenticado e não pode ter contrato de intermediação.
        O cliente precisa estar cadastrado antes da simulação, pelas rotas de Cliente.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['cpf', 'placa', 'valorVeiculo', 'valorEntrada', 'uf', 'isVeiculoZeroKm', 'cnpjLoja']
              additionalProperties: false
              properties:
                cpf:
                  type: string
                  minLength: 11
                  description: CPF do cliente **somente números** (11 dígitos)
                  example: "12345678901"
                placa:
                  type: string
                  description: Placa do veículo no padrão antigo (ABC-1234) ou Mercosul (ABC1D23)
                  example: ABC1D23
                valorVeiculo:
                  type: number
                  format: double
                  description: Valor total do veículo, em reais. Deve ser maior que zero.
                  example: 45000
                valorEntrada:
                  type: number
                  format: double
                  description: Valor de entrada, em reais. Informe zero quando não houver entrada; deve ser menor que o valor do veículo.
                  example: 5000
                uf:
                  type: string
                  description: UF do registro do veículo, com 2 letras (ex. SP, RJ, MG).
                  example: SP
                isVeiculoZeroKm:
                  type: boolean
                  description: Indica se o veículo é zero quilômetro. `true` para novo, `false` para usado.
                  example: false
                cnpjLoja:
                  type: string
                  description: CNPJ da loja de integração vinculada ao parceiro, formatado ou apenas números.
                  example: 11.222.333/0001-81
      responses:
        '201':
          description: Simulação criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimplifySimulationListResponse"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Loja não encontrada ou não vinculada a este parceiro (`Store.Integration.NotFound`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v2/proposal/simulation/refinancing:
    post:
      tags:
        - Proposta
      summary: Criar uma nova simulação de refinanciamento
      description: |
        Cria uma nova simulação de refinanciamento selecionando a loja de integração pelo CNPJ (`cnpjLoja`).
        A loja precisa estar vinculada ao parceiro autenticado e não pode ter contrato de intermediação.
        O cliente precisa estar cadastrado com endereço, e o `valorSolicitado` precisa estar dentro da faixa refinanciável da placa.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['cpf', 'placa', 'valorSolicitado', 'cnpjLoja']
              additionalProperties: false
              properties:
                cpf:
                  type: string
                  minLength: 11
                  description: CPF do cliente **somente números** (11 dígitos)
                  example: "12345678901"
                placa:
                  type: string
                  description: Placa do veículo no padrão antigo (ABC-1234) ou Mercosul (ABC1D23)
                  example: ABC1D23
                valorSolicitado:
                  type: number
                  format: double
                  description: Valor solicitado para refinanciamento, em reais. Deve estar dentro da faixa refinanciável da placa.
                  example: 25000
                cnpjLoja:
                  type: string
                  description: CNPJ da loja de integração vinculada ao parceiro, formatado ou apenas números.
                  example: 11.222.333/0001-81
      responses:
        '201':
          description: Simulação criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimplifySimulationListResponse"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Loja não encontrada ou não vinculada a este parceiro (`Store.Integration.NotFound`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v2/proposal:
    post:
      tags:
        - Proposta
      summary: Criar uma nova proposta
      description: |
        Cria uma proposta a partir de uma simulação feita com `cnpjLoja`. A simulação precisa pertencer ao parceiro e ter
        sido feita em uma loja de integração vinculada a ele. O cliente precisa estar com o cadastro completo
        (endereço, tipo de ocupação e renda).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['cpf', 'simulacaoId']
              additionalProperties: false
              properties:
                cpf:
                  type: string
                  minLength: 11
                  description: CPF do cliente, com ou sem pontuação (11 dígitos). Os dígitos verificadores são validados.
                  example: "12345678901"
                simulacaoId:
                  type: string
                  format: uuid
                  description: Identificador da simulação escolhida (retornado em `id_simulacao`)
                  example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
      responses:
        '201':
          description: Proposta criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_proposta:
                    type: string
                    format: uuid
                    description: Identificador único da proposta
                    example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Simulação ou loja não encontrada para este parceiro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: A Idempotency-Key já foi usada com outro conteúdo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v2/proposal/{propostaId}:
