          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v2/proposal/{propostaId}/deposit-account:
    post:
      tags:
        - Proposta
      summary: Incluir a conta de recebimento
      description: |
        Inclui ou substitui a conta de recebimento de uma proposta de **refinanciamento**, enquanto a
        etapa ativa for `CONTA_RECEBIMENTO` (5). O titular deve ser o cliente da proposta. Propostas de financiamento
        não são aceitas. Enviar novamente substitui a conta anterior.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['cpfTitular', 'codigoBanco', 'agencia', 'digitoAgencia', 'conta', 'digitoConta', 'tipoConta']
              additionalProperties: false
              properties:
                cpfTitular:
                  type: string
                  description: CPF do titular da conta, formatado ou apenas números. Deve ser o CPF do cliente da proposta.
                  example: "12345678901"
                codigoBanco:
                  type: string
                  description: Código do banco (COMPE) com 3 dígitos.
                  example: "001"
                agencia:
                  type: string
                  description: Número da agência com 4 dígitos, sem o dígito verificador.
                  example: "1234"
                digitoAgencia:
                  type: string
                  description: Dígito verificador da agência (número ou X).
                  example: "5"
                conta:
                  type: string
                  description: Número da conta, de 4 a 13 dígitos, sem o dígito verificador.
                  example: "123456"
                digitoConta:
                  type: string
                  description: Dígito verificador da conta (número ou X).
                  example: "7"
                tipoConta:
                  type: string
                  description: Tipo da conta.
                  enum: ['CORRENTE', 'POUPANCA', 'PAGAMENTO']
                  example: CORRENTE
      responses:
        '200':
          description: Conta de recebimento registrada
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Proposta não encontrada para este parceiro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v2/proposal/{propostaId}/document:
    post:
      tags:
        - Proposta
      summary: Enviar documento de participante
      description: |
        Envia um documento do comprador ou da loja em Base64 (até 10 MiB decodificado; PDF, JPG/JPEG ou PNG).
        Aceito quando a etapa ativa do participante for `ENVIO_DOCUMENTOS` (6) com a proposta aprovada, ou
        `CORRECAO_DOCUMENTOS` (7) para reenviar um tipo atualmente recusado (`INVALIDO`). O header `Idempotency-Key` é obrigatório.

        | Código de erro | Quando ocorre |
        | --- | --- |
        | `Document.InvalidParticipant` | `participante` diferente de `COMPRADOR` ou `LOJA`. |
        | `Document.InvalidType` | Tipo de documento não aceito para o participante. |
        | `Document.InvalidName` | Nome de arquivo vazio, com caminho, com mais de 255 caracteres ou com extensão não aceita. |
        | `Document.InvalidBase64` | Conteúdo Base64 inválido. |
        | `Document.Empty` | Arquivo vazio. |
        | `Document.TooLarge` | Arquivo maior que 10 MiB depois de decodificado. |
        | `Document.InvalidContent` | O conteúdo não corresponde à extensão informada. |
        | `Document.InvalidProposalStage` | A etapa ativa não permite o envio de documentos. |
        | `Document.NotPendingCorrection` | Em correção, o tipo enviado não está recusado. |
        | `Idempotency.KeyConflict` | A `Idempotency-Key` já foi usada com outro conteúdo. |
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProposalId"
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave única por envio (1 a 200 caracteres). Reenviar a mesma chave com o mesmo conteúdo devolve o mesmo resultado; com conteúdo diferente retorna `Idempotency.KeyConflict`.
          schema:
            type: string
            example: doc-7f3c2a10-comprador-cnh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['participante', 'tipoDocumento', 'nomeArquivo', 'conteudoBase64']
              additionalProperties: false
              properties:
                participante:
                  type: string
                  description: Participante dono do documento.
                  enum: ['COMPRADOR', 'LOJA']
                  example: COMPRADOR
                tipoDocumento:
                  type: integer
                  format: int32
                  description: |
                    Código do tipo de documento. Tipos aceitos por participante:
                      - COMPRADOR: 1, 4, 5, 6, 7, 9, 57
                      - LOJA: 6, 8

                    Códigos: 1 = CNH, 4 = Comprovante de renda, 5 = Comprovante de residência,
                    6 = Documento do veículo, 7 = CNH digital, 8 = Laudo ECV, 9 = Laudo de vistoria, 57 = ATPV.
                  example: 1
                nomeArquivo:
                  type: string
                  maxLength: 255
                  description: Nome do arquivo com extensão `.pdf`, `.jpg`, `.jpeg` ou `.png`, sem caminho. A extensão precisa corresponder ao conteúdo real do arquivo.
                  example: cnh-comprador.pdf
                conteudoBase64:
                  type: string
                  description: Conteúdo do arquivo em Base64 puro (sem prefixo `data:`), até 10 MiB depois de decodificado.
                  example: JVBERi0xLjcKJcOkw7zDtsOfCjIgMCBvYmoK...
      responses:
        '200':
          description: Documento recebido
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Proposta não encontrada para este parceiro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
