openapi: 3.1.0
info:
  title: API Credicarro
  description: API para gerenciamento de cobranças e pagamentos usando o Credicarro.
  version: 1.0.0
servers:
  - url: https://api.staging.credicarro.com.br/integration
    description: Servidor para o ambiente de staging
  - url: https://api.credicarro.com.br/integration
    description: Servidor para o ambiente de produção
paths:
  /v1/proposal:
    post:
      tags:
        - Proposta
      summary: Criar uma nova proposta
      description: Cria uma nova proposta a partir de uma simulação existente
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Os dados da sua proposta
              required: ['cpf', 'simulacaoId']
              additionalProperties: false
              properties:
                cpf:
                  minLength: 11
                  type: string
                  description: CPF do cliente, com ou sem pontuação (11 dígitos). Os dígitos verificadores são validados.
                  example: "12345678901"
                simulacaoId:
                  type: string
                  format: uuid
                  description: Identificador único da simulação
                  example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
      responses:
        '201':
          description: Proposta criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_proposta:
                    type: string
                    format: uuid
                    description: Identificador único da proposta
                    example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    get:
      tags:
        - Proposta
      summary: Paginação de propostas
      description:  Paginação de propostas
      security:
        - bearerAuth: []
      parameters:
        - name: pagina_inicial
          in: query
          description: Página inicial (mínimo 1)
          schema:
            type: integer
            format: int32
            example: 1
        - name: limite
          in: query
          description: Quantidade de itens por página (1 a 100)
          schema:
            type: integer
            format: int32
            example: 10
      responses:
        '200':
          description: Lista de propostas retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    description: Lista de propostas
                    items:
                      $ref: "#/components/schemas/ProposalResponse"
                  pagina:
                    $ref: "#/components/schemas/Page"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/{propostaId}:
    get:
      tags:
        - Proposta
      summary: Consultar proposta pelo ID.
      description: Consulta os detalhes de uma proposta específica utilizando o seu ID
      security:
        - bearerAuth: []
      parameters:
        - name: propostaId
          in: path
          description: Identificador único da proposta (UUID) retornado na criação da proposta
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único da proposta
            example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
      responses:
        '200':
          description: Proposta retornada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation/range/financing:
    get:
      tags:
        - Simulação
      summary: Consultar valor mínimo de entrada por prazo para financiamento
      description: Consulta o valor mínimo de entrada por prazo pela placa informada
      security:
        - bearerAuth: []
      parameters:
        - name: placa
          in: query
          description: Placa do veículo para busca
          required: true
          schema:
            type: string
            minLength: 7
            example: ABC-1234
            description: Placa do veículo
      responses:
        '200':
          description: Faixa Financiável retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  opcoes_por_prazo:
                    type: array
                    items:
                      type: object
                      properties:
                        prazo:
                          type: integer
                          format: int32
                          description: Prazo em meses
                          example: 12
                        valor_minimo_entrada:
                          type: number
                          format: double
                          description: Valor mínimo de entrada para o prazo
                          example: 5000.00
                      additionalProperties: false
                    nullable: true
                additionalProperties: false
        '400':
          description: Bad Request — parâmetros inválidos ou ausentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '401':
          description: Unauthorized — token ausente ou inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation/range/refinancing:
    get:
      tags:
        - Proposta
      summary: Consultar valor mínimo e máximo refinanciável
      description: Consulta o valor mínimo e máximo refinanciável pela placa informada
      security:
        - bearerAuth: []
      parameters:
        - name: placa
          in: query
          description: Placa do veículo para busca
          required: true
          schema:
            type: string
            minLength: 7
            example: ABC-1234 ou ABC1D23
            description: Placa do veículo
      responses:
        '200':
          description: Faixa de valor refinanciavel
          content:
            application/json:
              schema:
                type: object
                properties:
                  opcoes_por_prazo:
                    type: array
                    items:
                      type: object
                      properties:
                        prazo:
                          type: integer
                          format: int32
                          description: Prazo
                          example: 6
                        valor_minimo_refinanciavel:
                          type: number
                          format: double
                          description: Mínimo valor refinanciavel
                          example: 12480
                        valor_maximo_refinanciavel:
                          type: number
                          format: double
                          description: Máximo valor refinanciavel
                          example: 35720
                      additionalProperties: false
                    nullable: true
                additionalProperties: false
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation:
    get:
      tags:
        - Proposta
      summary: Paginação de simulações
      description: Paginação de simulações
      security:
        - bearerAuth: []
      parameters:
        - name: pagina_inicial
          in: query
          description: Página inicial (mínimo 1)
          schema:
            type: integer
            format: int32
            example: 1
        - name: limite
          in: query
          description: Quantidade de itens por página (1 a 100)
          schema:
            type: integer
            format: int32
            example: 10
      responses:
        '200':
          description: Lista de simulações retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    description: Lista de simulações
                    items:
                      $ref: "#/components/schemas/SimulationResponse"
                  pagina:
                    $ref: "#/components/schemas/Page"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation/{simulacaoId}:
    get:
      tags:
        - Proposta
      summary: Consultar simulação pelo ID.
      description: Consulta os detalhes de uma simulação específica utilizando o seu ID
      security:
        - bearerAuth: []
      parameters:
        - name: simulacaoId
          in: path
          description: Identificador único da simulaçao (UUID) retornado na criação da simulaçao
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único da simulaçao
            example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
      responses:
        '200':
          description: Simulaçao retornada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResponse"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation/financing:
    post:
      tags:
        - Proposta
      summary: Criar uma nova simulação de financiamento
      description: Cria uma nova simulação de financiamento
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Os dados da sua simulação
              required: ['cpf', 'isVeiculoZeroKm', 'placa', 'valorVeiculo', 'uf', 'valorEntrada']
              additionalProperties: false
              properties:
                cpf:
                  minLength: 11
                  type: string
                  description: CPF do cliente **somente números** (11 dígitos)
                  example: "12345678901"
                isVeiculoZeroKm:
                  type: boolean
                  description: Indica se o veículo é zero quilômetro. true para novo, false para usado.
                  example: true
                placa:
                  type: string
                  description: Placa do veículo
                  example: ABC1D23
                valorVeiculo:
                  type: number
                  description: Valor total do veículo
                  format: double
                  example: 45000
                uf:
                  type: string
                  description: UF (Unidade Federativa) do registro do veículo, em formato de 2 letras (ex. SP, RJ, MG).
                  example: "SP"
                valorEntrada:
                  type: number
                  description: Valor de entrada do financiamento, em reais. Utilize ponto como separador decimal. Informe zero quando não houver entrada; deve ser menor que o valor do veículo.
                  format: double
                  example: 5000
      responses:
        '201':
          description: Simulação criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulacoes:
                    type: array
                    items:
                      type: object
                      properties:
                        id_simulacao:
                          type: string
                          format: uuid
                          example: 123e4567-e89b-12d3-a456-426614174000
                        valor_solicitado:
                          type: number
                          format: double
                          example: 1
                        prazo:
                          type: integer
                          format: int32
                          example: 1
                        valor_parcela:
                          type: number
                          format: double
                          example: 1
                        valor_tac:
                          type: number
                          format: double
                          example: 1
                        valor_boleto:
                          type: number
                          format: double
                          example: 1
                        valor_seguro:
                          type: number
                          format: double
                          example: 1
                        valor_iof:
                          type: number
                          format: double
                          example: 1
                        percentual_iof:
                          type: number
                          format: double
                          example: 1
                        valor_credito_total:
                          type: number
                          format: double
                          example: 1
                        valor_divida_total:
                          type: number
                          format: double
                          example: 1
                        percentual_cet_mensal:
                          type: number
                          format: double
                          example: 1
                        percentual_cet_anual:
                          type: number
                          format: double
                          example: 1
                        percentual_juros_mensal:
                          type: number
                          format: double
                          example: 1
                        percentual_juros_anual:
                          type: number
                          format: double
                          example: 1
                        valor_retencao_diaria_aproximado:
                          type: number
                          format: double
                          nullable: true
                          example: null
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation/refinancing:
    post:
      tags:
        - Proposta
      summary: Criar uma nova simulação de refinanciamento
      description: Cria uma nova simulação de refinanciamento
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Os dados da sua simulação
              required: ['placa', 'valorSolicitado', 'cpf']
              additionalProperties: false
              properties:
                cpf:
                  minLength: 11
                  type: string
                  description: CPF do cliente **somente números** (11 dígitos)
                  example: "12345678901"
                placa:
                  minLength: 1
                  type: string
                  description: Placa do veículo
                  example: ABC1D23
                valorSolicitado:
                  type: number
                  description: Valor total solicitado para refinanciamento
                  format: double
                  example: 45000
      responses:
        '201':
          description: Simulação criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulacoes:
                    type: array
                    items:
                      type: object
                      properties:
                        id_simulacao:
                          type: string
                          format: uuid
                          example: 123e4567-e89b-12d3-a456-426614174000
                        valor_solicitado:
                          type: number
                          format: double
                          example: 1
                        prazo:
                          type: integer
                          format: int32
                          example: 1
                        valor_parcela:
                          type: number
                          format: double
                          example: 1
                        valor_tac:
                          type: number
                          format: double
                          example: 1
                        valor_boleto:
                          type: number
                          format: double
                          example: 1
                        valor_seguro:
                          type: number
                          format: double
                          example: 1
                        valor_iof:
                          type: number
                          format: double
                          example: 1
                        percentual_iof:
                          type: number
                          format: double
                          example: 1
                        valor_credito_total:
                          type: number
                          format: double
                          example: 1
                        valor_divida_total:
                          type: number
                          format: double
                          example: 1
                        percentual_cet_mensal:
                          type: number
                          format: double
                          example: 1
                        percentual_cet_anual:
                          type: number
                          format: double
                          example: 1
                        percentual_juros_mensal:
                          type: number
                          format: double
                          example: 1
                        percentual_juros_anual:
                          type: number
                          format: double
                          example: 1
                        valor_retencao_diaria_aproximado:
                          type: number
                          format: double
                          nullable: true
                          example: null
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/authentication/accesstoken:
    post:
      tags:
        - Autenticação
      summary: Gerar token de acesso.
      description: Gera um token de acesso para o parceiro utilizando as credenciais do cliente.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  description: Identificador do cliente de integração fornecido pelo Credicarro
                  example: 8pqh3k1y0zmtg4u9xenrcvlsw2
                clientSecret:
                  type: string
                  description: Segredo do cliente de integração fornecido pelo Credicarro
                  example: 8qzn2v0w5lgyh3cmt9a7jrk1f4bepsdu6xovifn3t5hlgq7r9kc
              required:
                - clientId
                - clientSecret
      responses:
        '200':
          description: autenticação retornada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/authenticationResponse"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '401':
          description: Credenciais inválidas ou integração inativa (`Integration.Authentication.InvalidCredentials`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/customer:
    post:
      tags:
        - Cliente
      summary: Criar um novo cliente
      description: Cria um novo cliente com base nos dados fornecidos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Dados do novo cliente
              required: ['celular', 'cpf', 'dataDeNascimento', 'email', 'nome', 'sobrenome']
              additionalProperties: false
              properties:
                celular:
                  type: string
                  minLength: 1
                  description: Telefone celular exatamente no formato `+55 (DD) 99999-9999`.
                  example: "+55 (11) 99876-5432"
                cpf:
                  type: string
                  minLength: 1
                  maxLength: 11
                  description: CPF do cliente, com ou sem pontuação (11 dígitos). Os dígitos verificadores são validados.
                  example: "12345678901"
                dataDeNascimento:
                  type: string
                  format: date-time
                  description: Data de nascimento em ISO-8601. O cliente precisa ter entre 18 e 75 anos.
                  example: "1990-05-20T00:00:00-03:00"
                email:
                  type: string
                  minLength: 1
                  description: Endereço de e-mail do cliente.
                  example: "maria.souza@exemplo.com.br"
                nome:
                  type: string
                  minLength: 1
                  description: Primeiro nome do cliente.
                  example: "Maria"
                sobrenome:
                  type: string
                  minLength: 1
                  description: Sobrenome do cliente.
                  example: "Souza"
      responses:
        '200':
          description: Cliente criado ou atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_cliente:
                    type: string
                    format: uuid
                    description: Identificador único do cliente
                    example: 123e4567-e89b-12d3-a456-426614174000
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: Integração inativa (`Integration.Access.Inactive`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: CPF, e-mail ou celular já cadastrado (`Cpf.CpfAlreadyAdded`, `Email.EmailAlreadyAdded`, `Phone.PhoneAlreadyAdded`), ou Idempotency-Key reutilizada com outro conteúdo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/customer/address:
    post:
      tags:
        - Cliente
      summary: Criar ou atualizar endereço de um cliente
      description: Cria ou atualiza o endereço de um cliente com base nos dados fornecidos.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Dados para criação ou atualização de endereço
              required: ['cpf', 'endereco']
              additionalProperties: false
              properties:
                cpf:
                  type: string
                  minLength: 11
                  maxLength: 11
                  description: CPF do cliente, com ou sem pontuação (11 dígitos). Os dígitos verificadores são validados.
                  example: "12345678901"
                endereco:
                  type: object
                  required: ['rua', 'cidade', 'estado', 'bairro', 'cep']
                  additionalProperties: false
                  properties:
                    rua:
                      type: string
                      description: Nome da rua.
                      example: "Av. Paulista"
                    cidade:
                      type: string
                      description: Cidade.
                      example: "São Paulo"
                    estado:
                      type: string
                      description: Estado.
                      example: "SP"
                    bairro:
                      type: string
                      description: Bairro.
                      example: "Bela Vista"
                    cep:
                      type: string
                      description: CEP com 8 dígitos, com ou sem hífen.
                      example: "01311000"
                    numero:
                      type: string
                      description: Número do endereço (opcional).
                      example: "1578"
                    complemento:
                      type: string
                      description: Complemento (opcional).
                      example: "Bloco B, Apto 1203"
      responses:
        '202':
          description: Endereço aceito para criação ou atualização
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Cliente não encontrado (`Customer.Account.NotFound`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: Integração inativa (`Integration.Access.Inactive`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: A Idempotency-Key já foi usada com outro conteúdo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/customer/professional:
    post:
      tags:
        - Cliente
      summary: Criar ou atualizar dados profissionais de um cliente
      description: Cria ou atualiza as informações profissionais de um cliente com base nos dados fornecidos.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Dados profissionais do cliente
              required: ['cpf', 'tipoOcupacao', 'renda']
              additionalProperties: false
              properties:
                cpf:
                  type: string
                  minLength: 11
                  maxLength: 11
                  description: CPF do cliente, com ou sem pontuação (11 dígitos). Os dígitos verificadores são validados.
                  example: "12345678901"
                tipoOcupacao:
                  type: integer
                  format: int32
                  description: |
                    Tipo de ocupação do cliente.
                    Valores aceitos:
                      - 1 = aposentado
                      - 2 = pensionista
                      - 3 = assalariado
                      - 4 = autônomo
                      - 6 = freelancer
                      - 7 = proprietário
                  example: 1
                renda:
                  type: number
                  format: double
                  description: Renda mensal do cliente, em reais (use ponto como separador decimal).
                  example: 6500.00
      responses:
        '202':
          description: Dados profissionais aceitos para criação ou atualização
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Cliente não encontrado (`Customer.Account.NotFound`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: Integração inativa (`Integration.Access.Inactive`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: A Idempotency-Key já foi usada com outro conteúdo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/customer/unified:
    post:
      tags:
        - Cliente
      summary: Criar ou atualizar cliente com dados completos
      description: Cria ou atualiza um cliente incluindo informações pessoais, endereço e dados profissionais.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Dados completos do cliente
              required: ['celular', 'cpf', 'dataDeNascimento', 'email', 'nome', 'sobrenome', 'endereco', 'dadosProfissionais']
              additionalProperties: false
              properties:
                celular:
                  type: string
                  minLength: 1
                  description: Telefone celular exatamente no formato `+55 (DD) 99999-9999`.
                  example: "+55 (11) 99876-5432"
                cpf:
                  type: string
                  minLength: 11
                  maxLength: 11
                  description: CPF do cliente, com ou sem pontuação (11 dígitos). Os dígitos verificadores são validados.
                  example: "12345678901"
                dataDeNascimento:
                  type: string
                  format: date-time
                  description: Data de nascimento em ISO-8601. O cliente precisa ter entre 18 e 75 anos.
                  example: "1990-05-20T00:00:00-03:00"
                email:
                  type: string
                  minLength: 1
                  description: Endereço de e-mail do cliente.
                  example: "maria.souza@exemplo.com.br"
                nome:
                  type: string
                  minLength: 1
                  description: Primeiro nome do cliente.
                  example: "Maria"
                sobrenome:
                  type: string
                  minLength: 1
                  description: Sobrenome do cliente.
                  example: "Souza"
                endereco:
                  type: object
                  required: ['rua', 'cidade', 'estado', 'bairro', 'cep']
                  properties:
                    rua:
                      type: string
                      example: "Av. Paulista"
                    cidade:
                      type: string
                      example: "São Paulo"
                    estado:
                      type: string
                      example: "SP"
                    bairro:
                      type: string
                      example: "Bela Vista"
                    cep:
                      type: string
                      example: "01311000"
                    numero:
                      type: string
                      example: "1578"
                    complemento:
                      type: string
                      example: "Bloco B, Apto 1203"
                dadosProfissionais:
                  type: object
                  required: ['tipoOcupacao', 'renda']
                  properties:
                    tipoOcupacao:
                      type: integer
                      format: int32
                      description: |
                        Tipo de ocupação do cliente.
                        Valores aceitos:
                          - 1 = aposentado
                          - 2 = pensionista
                          - 3 = assalariado
                          - 4 = autônomo
                          - 6 = freelancer
                          - 7 = proprietário
                      example: 1
                    renda:
                      type: number
                      format: double
                      description: Renda mensal do cliente em reais.
                      example: 6500.00
      responses:
        '200':
          description: Cliente criado ou atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_cliente:
                    type: string
                    format: uuid
                    description: Identificador único do cliente
                    example: 123e4567-e89b-12d3-a456-426614174000
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '403':
          description: Integração inativa (`Integration.Access.Inactive`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '409':
          description: CPF, e-mail ou celular já cadastrado na criação com Idempotency-Key, ou Idempotency-Key reutilizada com outro conteúdo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/webhook:
    post:
      tags:
        - Webhook
      summary: Cadastrar um webhook
      description: |
        Cadastra um webhook ativo para o parceiro autenticado. É permitido mais de um webhook por tipo.
        A resposta traz o segredo de assinatura (`segredo_assinatura`) em claro, usado para validar o header
        `X-CrediCarro-Signature` das notificações. Ele não pode ser recuperado depois, então guarde-o nesse momento.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['tipo', 'url', 'tipo_autenticacao']
              additionalProperties: false
              properties:
                tipo:
                  type: integer
                  format: int32
                  description: |
                    Evento notificado pelo webhook.
                    Valores aceitos:
                      - 1 = Customer
                      - 2 = Simulation
                      - 3 = Proposal
                  example: 3
                url:
                  type: string
                  description: URL absoluta (http ou https) que receberá as notificações.
                  example: https://parceiro.com.br/webhooks/credicarro
                tipo_autenticacao:
                  type: integer
                  format: int32
                  description: |
                    Autenticação enviada pela Credicarro ao chamar a URL. Não pode ser alterada depois da criação.
                    Valores aceitos:
                      - 1 = None (sem autenticação)
                      - 2 = Basic
                      - 3 = Jwt
                  example: 2
                credencial:
                  type: string
                  description: |
                    Credencial enviada no header `Authorization`. Obrigatória para Basic (valor em Base64 de `usuario:senha`,
                    enviado como `Basic {credencial}`) e Jwt (token enviado como `Bearer {credencial}`).
                  example: dXN1YXJpbzpzZW5oYQ==
      responses:
        '201':
          description: Webhook cadastrado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_webhook:
                    type: string
                    format: uuid
                    description: Identificador único do webhook
                    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  segredo_assinatura:
                    type: string
                    description: Segredo usado para validar a assinatura `X-CrediCarro-Signature`. Retornado somente nesta resposta.
                    example: "<segredo-de-assinatura>"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    get:
      tags:
        - Webhook
      summary: Consultar webhooks do parceiro
      description: Traz, de forma paginada, os webhooks cadastrados para o parceiro autenticado. A credencial e o segredo de assinatura não são retornados.
      security:
        - bearerAuth: []
      parameters:
        - name: pagina_inicial
          in: query
          description: Página inicial (mínimo 1)
          schema:
            type: integer
            format: int32
            example: 1
        - name: limite
          in: query
          description: Quantidade de itens por página (1 a 100)
          schema:
            type: integer
            format: int32
            example: 10
      responses:
        '200':
          description: Lista de webhooks retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookResponse"
                  pagina:
                    $ref: "#/components/schemas/Page"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/webhook/{webhookId}:
    put:
      tags:
        - Webhook
      summary: Editar um webhook
      description: |
        Atualiza o tipo, a URL e o status de um webhook do parceiro autenticado. A autenticação (tipo e credencial)
        não pode ser alterada; para trocá-la, exclua o webhook e cadastre outro.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['tipo', 'url']
              additionalProperties: false
              properties:
                tipo:
                  type: integer
                  format: int32
                  description: |
                    Evento notificado pelo webhook.
                    Valores aceitos:
                      - 1 = Customer
                      - 2 = Simulation
                      - 3 = Proposal
                  example: 3
                url:
                  type: string
                  description: URL absoluta (http ou https) que receberá as notificações.
                  example: https://parceiro.com.br/webhooks/credicarro
                status:
                  type: integer
                  format: int32
                  description: |
                    Status do webhook. Quando omitido, mantém o status atual.
                    Valores aceitos:
                      - 1 = Active
                      - 2 = Inactive
                  example: 1
      responses:
        '204':
          description: Webhook atualizado com sucesso
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Webhook não encontrado para este parceiro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      tags:
        - Webhook
      summary: Excluir um webhook
      description: Remove um webhook do parceiro autenticado; ele deixa de receber notificações.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      responses:
        '204':
          description: Webhook excluído com sucesso
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Webhook não encontrado para este parceiro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v2/proposal/simulation/range/financing:
    get:
      tags:
        - Simulação
      summary: Consultar valor mínimo de entrada por prazo para financiamento
      description: |
        Consulta o valor mínimo de entrada por prazo pela placa informada, selecionando a loja de integração pelo
        CNPJ (`cnpjLoja`). A loja precisa estar vinculada ao parceiro autenticado e não pode ter contrato de
        intermediação.
      security:
        - bearerAuth: []
      parameters:
        - name: placa
          in: query
          description: Placa do veículo para busca
          required: true
          schema:
            type: string
            minLength: 7
            example: ABC-1234
            description: Placa do veículo
        - name: cnpjLoja
          in: query
          description: CNPJ da loja de integração vinculada ao parceiro, formatado ou apenas números
          required: true
          schema:
            type: string
            example: 11.222.333/0001-81
      responses:
        '200':
          description: Faixa Financiável retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  opcoes_por_prazo:
                    type: array
                    items:
                      type: object
                      properties:
                        prazo:
                          type: integer
                          format: int32
                          description: Prazo em meses
                          example: 12
                        valor_minimo_entrada:
                          type: number
                          format: double
                          description: Valor mínimo de entrada para o prazo
                          example: 5000.00
                      additionalProperties: false
                    nullable: true
                additionalProperties: false
        '400':
          description: Bad Request — parâmetros inválidos ou ausentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '401':
          description: Unauthorized — token ausente ou inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '404':
          description: Loja não encontrada ou não vinculada a este parceiro (`Store.Integration.NotFound`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        '422':
          description: Loja de integração com contrato de intermediação não é permitida (`Store.Integration.Intermediation`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
