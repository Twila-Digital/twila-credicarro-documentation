          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v2/proposal/{propostaId}/vehicle-detail:
    post:
      tags:
        - Proposta
      summary: Incluir os dados do veículo
      description: |
        Inclui ou atualiza placa, Renavam, chassi e cor do veículo de uma proposta. Aceito somente
        enquanto a etapa ativa for `DADOS_VEICULO` (8).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProposalId"
