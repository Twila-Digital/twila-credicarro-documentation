openapi: 3.1.0
info:
  title: API Credicarro
  description: API para gerenciamento de cobranças e pagamentos usando o Credicarro.
  version: 1.0.0
servers:
  - url: https://api.staging.credicarro.com.br/integration
    description: Servidor para o ambiente de staging
paths:
  /v1/proposal:
    post:
      tags:
        - Proposta
      summary: Criar uma nova proposta
      description: Cria uma nova proposta a partir de uma simulação existente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Os dados da sua proposta
              required: ['cpf', 'simulacaoId']
              additionalProperties: false
              properties:
                cpf:
                  minLength: 11
                  type: string
                  description: CPF do cliente **somente números** (11 dígitos).
                  example: "12345678901"
                simulacaoId:
                  type: string
                  format: uuid
                  description: Identificador único da simulação
                  example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
      responses:
        '201':
          description: Proposta criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_proposta:
                    type: string
                    format: uuid
                    description: Identificador único da proposta
                    example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    get:
      tags:
        - Proposta
      summary: Paginação de propostas
      description:  Paginação de propostas
      security:
        - bearerAuth: []
      parameters:
        - name: pagina_inicial
          in: query
          description: Página inicial (mínimo 1)
          schema:
            type: integer
            format: int32
            example: 1
        - name: limite
          in: query
          description: Quantidade de itens por página (1 a 100)
          schema:
            type: integer
            format: int32
            example: 10
      responses:
        '200':
          description: Lista de propostas retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    description: Lista de propostas
                    items:
                      $ref: "#/components/schemas/ProposalResponse"
                  pagina:
                    $ref: "#/components/schemas/Page"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/{propostaId}:
    get:
      tags:
        - Proposta
      summary: Consultar proposta pelo ID.
      description: Consulta os detalhes de uma proposta específica utilizando o seu ID
      security:
        - bearerAuth: []
      parameters:
        - name: propostaId
          in: path
          description: Identificador único da proposta (UUID) retornado na criação da proposta
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único da proposta
            example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
      responses:
        '200':
          description: Proposta retornada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation/range/refinancing:
    get:
      tags:
        - Proposta
      summary: Consultar valor mínimo e máximo refinanciável
      description: Consulta o valor mínimo e máximo refinanciável pela placa informada
      security:
        - bearerAuth: []
      parameters:
        - name: placa
          in: query
          description: Placa do veículo para busca
          required: true
          schema:
            type: string
            minLength: 7
            example: ABC-1234 ou ABC1D23
            description: Placa do veículo
      responses:
        '200':
          description: Faixa de valor refinanciavel
          content:
            application/json:
              schema:
                type: object
                properties:
                  opcoes_por_prazo:
                    type: array
                    items:
                      type: object
                      properties:
                        prazo:
                          type: integer
                          format: int32
                          description: Prazo
                          example: 6
                        valor_minimo_refinanciavel:
                          type: number
                          format: double
                          description: Mínimo valor refinanciavel
                          example: 12480
                        valor_maximo_refinanciavel:
                          type: number
                          format: double
                          description: Máximo valor refinanciavel
                          example: 35720
                      additionalProperties: false
                    nullable: true
                additionalProperties: false
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation:
    get:
      tags:
        - Proposta
      summary: Paginação de simulações
      description: Paginação de simulações
      security:
        - bearerAuth: []
      parameters:
        - name: pagina_inicial
          in: query
          description: Página inicial (mínimo 1)
          schema:
            type: integer
            format: int32
            example: 1
        - name: limite
          in: query
          description: Quantidade de itens por página (1 a 100)
          schema:
            type: integer
            format: int32
            example: 10
      responses:
        '200':
          description: Lista de simulações retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    description: Lista de simulações
                    items:
                      $ref: "#/components/schemas/SimulationResponse"
                  pagina:
                    $ref: "#/components/schemas/Page"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation/{simulacaoId}:
    get:
      tags:
        - Proposta
      summary: Consultar simulação pelo ID.
      description: Consulta os detalhes de uma simulação específica utilizando o seu ID
      security:
        - bearerAuth: []
      parameters:
        - name: simulacaoId
          in: path
          description: Identificador único da simulaçao (UUID) retornado na criação da simulaçao
          required: true
          schema:
            type: string
            format: uuid
            description: Identificador único da simulaçao
            example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
      responses:
        '200':
          description: Simulaçao retornada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResponse"
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/proposal/simulation/refinancing:
    post:
      tags:
        - Proposta
      summary: Criar uma nova simulação de refinanciamento
      description: Cria uma nova simulação de refinanciamento
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Os dados da sua simulação
              required: ['placa', 'valor_solicitado', 'cpf']
              additionalProperties: false
              properties:
                cpf:
                  minLength: 11
                  type: string
                  description: CPF do cliente **somente números** (11 dígitos)
                  example: "12345678901"
                placa:
                  minLength: 1
                  type: string
                  description: Placa do veículo
                  example: ABC1D23
                valorSolicitado:
                  type: number
                  description: Valor total solicitado para refinanciamento
                  format: double
                  example: 45000
      responses:
        '201':
          description: Simulação criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_simulacao:
                    type: string
                    format: uuid
                    description: Identificador único da simulação
                    example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
                  valor_solicitado:
                    type: number
                    format: double
                    description: Valor solicitado
                    example: 37908
                  prazo:
                    type: integer
                    format: int32
                    description: Prazo da simulação
                    example: 24
                  valor_parcela:
                    type: number
                    format: double
                    description: Valor da parcela
                    example: 2356
                  valor_tac:
                    type: number
                    format: double
                    description: Valor da taxa de cadastro
                    example: 1500
                  valor_boleto:
                    type: number
                    format: double
                    description: Valor do boleto
                    example: 0
                  valor_seguro:
                    type: number
                    format: double
                    description: Valor do seguro
                    example: 0
                  valor_iof:
                    type: number
                    format: double
                    description: Valor de IOF
                    example: 872
                  percentual_iof:
                    type: number
                    format: double
                    description: Percentual de IOF
                    example: 1.92
                  valor_credito_total:
                    type: number
                    format: double
                    description: Valor total do credito
                    example: 78495
                  valor_divida_total:
                    type: number
                    format: double
                    description: Valor total da divida
                    example: 98495
                  percentual_cet_mensal:
                    type: number
                    format: double
                    description: Percentual mensal
                    example: 3.62
                  percentual_cet_anual:
                    type: number
                    format: double
                    description: Percentual anual
                    example: 43.44
                  percentual_juros_mensal:
                    type: number
                    format: double
                    description: Percentual mensal
                    example: 3.62
                  percentual_juros_anual:
                    type: number
                    format: double
                    description: Percentual anual
                    example: 43.44
                  valor_retencao_diaria_aproximado:
                    type: number
                    format: double
                    nullable: true
                    description: Valor de retenção diário
                    example: 0
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    SimulationResponse:
      type: object
      description: Os dados da sua simulação
      properties:
        id_simulacao:
          type: string
          format: uuid
          description: Identificador único da simulação
          example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
        prazo:
          type: integer
          format: int64
          description: Prazo da simulação
          example: 24
        valor_parcela:
          type: number
          format: double
          description: Valor da parcela
          example: 2356
        valor_solicitado:
          type: number
          format: double
          description: Valor solicitado
          example: 37908
        valor_entrada:
          type: number
          format: double
          description: Valor de entrada
          example: 9786
        valor_bem:
          type: number
          format: double
          description: Valor do bem
          example: 47694
        valor_tac:
          type: number
          format: double
          description: Valor da taxa de cadastro
          example: 1500
        taxa_juros_negociada:
          type: number
          format: double
          description: Valor da taxa de juros
          example: 2.79
        valor_registro:
          type: number
          format: double
          description: Valor do registro
          example: 487
        uf:
          type: string
          maxength: 2
          description: Estado da simulação
          example: "SP"
        tipo:
          type: string
          description: Tipo da proposta utilizada
          enum: ['Financing', 'Refinancing', 'AmountSimulation']
          example: Refinancing
        transacao:
          $ref: "#/components/schemas/Transaction"
        juros:
          $ref: "#/components/schemas/Interest"
        cet:
          $ref: "#/components/schemas/Cet"
        iof:
          $ref: "#/components/schemas/Iof"
        veiculo:
          $ref: "#/components/schemas/Vehicle"
        cliente:
          $ref: "#/components/schemas/Customer"
        data_criacao:
          type: string
          format: date-time
          example: 2025-10-17T19:05:08.984Z
          description: Data de criaçao da simulação
      additionalProperties: false
    Customer:
      type: object
      properties:
        cpf:
          type: string
          description: Documento de identificação do comprador
          example: 123.456.789-01
      additionalProperties: false
    Vehicle:
      type: object
      properties:
        marca:
          type: string
          description: Marca do Veículo
          example: "Honda"
        modelo:
          type: string
          description: Modelo do Veículo
          example: "Civic"
        versao:
          type: string
          description: Versão do Veículo
          example: "Turing"
        ano:
          type: integer
          format: int32
          nullable: true
          description: Ano do Veículo
          example: 2024
        valor:
          type: number
          format: double
          nullable: true
          description: Valor do Veículo
          example: 124654
        placa:
          type: string
          description: Placa do Veículo
          example: "MWO-3910"
        veiculo_zero_km:
          type: boolean
          nullable: true
          description: Indicador se veículo é 0KM
          example: false
        chassi:
          type: string
          description: Chassi do Veículo
          example: "1Y5Ye4U8kydsr4828"
        renavam:
          type: string
          description: Renavam do Veículo
          example: "70502561697"
        cor:
          type: string
          description: Cor do Veículo
          example: "Prata"
      additionalProperties: false
    Iof:
      type: object
      properties:
        valor:
          type: number
          format: double
          description: Valor de IOF
          example: 872
        percentual:
          type: number
          format: double
          description: Percentual de IOF
          example: 1.92
      additionalProperties: false
    Cet:
      type: object
      properties:
        percentual_mensal:
          type: number
          format: double
          description: Percentual mensal
          example: 3.62
        percentual_anual:
          type: number
          format: double
          description: Percentual anual
          example: 43.44
      additionalProperties: false
    Transaction:
      type: object
      properties:
        valor_total_credito:
          type: number
          format: double
          description: Valor total do credito
          example: 78495
        valor_total_debito:
          type: number
          format: double
          description: Valor total do debito
          example: 78495
      additionalProperties: false
    Interest:
      type: object
      properties:
        percentual_juros_mensal:
          type: number
          format: double
          description: Percentual de juros mensal
          example: 3.29
        percentual_juros_anual:
          type: number
          format: double
          description: Percentual de juros anual
          example: 39.48
      additionalProperties: false
    ProposalResponse:
      type: object
      description: Os dados da sua proposta
      properties:
        id_proposta:
          type: string
          format: uuid
          description: Identificador único da proposta
          example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
        numero:
          type: integer
          format: int64
          description: Número único da proposta
          example: 171020250001
        id_simulacao:
          type: string
          format: uuid
          description: Identificador único da simulação
          example: bea8d060-f93d-48eb-b6c4-45f64483cdd9
        tipo:
          type: string
          description: Tipo da proposta utilizada
          enum: ['Financing', 'Refinancing']
          example: Financing
        status:
          type: string
          description: Status atual da proposta
          enum: ['Analysing', 'Approved', 'Refused', 'Canceled', 'ManualAnalysis', 'Completed', 'InNegotiation', 'Expired']
          example: Approved
        comprador:
          $ref: "#/components/schemas/Buyer"
        vendedor:
          $ref: "#/components/schemas/Seller"
        data_criacao:
          type: string
          format: date-time
          example: 2025-10-17T19:05:08.984Z
          description: Data de criaçao da proposta
      additionalProperties: false
    Buyer:
      type: object
      properties:
        cpf:
          type: string
          description: Documento de identificação do comprador
          example: 123.456.789-01
      additionalProperties: false
    Seller:
      type: object
      properties:
        cpf:
          type: string
          description: Documento de identificação do vendedor
          example: 123.456.789-01
      additionalProperties: false
    Page:
      type: object
      properties:
        tem_proximo:
          type: boolean
          description: Identificador se existe uma próxima página
          example: true
        tem_anterior:
          type: boolean
          description: Identificador se existe uma página anterior
          example: false
        numero:
          type: integer
          format: int32
          description: Página atual.
          example: 2
        tamanho:
          type: integer
          format: int32
          description: Quantidade de dados por página
          example: 15
        total:
          type: integer
          format: int64
          description: Total de dados encontrados
          example: 45
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: Tipo de problema encontrado
          example: Partner.AccountIsIncompleted
        title:
          type: string
          description: Título do erro
          example: Bad Request
        status:
          type: integer
          format: int32
          description: Status Code do erro
          example: 400
        detail:
          type: string
          description: Descrição do erro
          example: Cadastro de conta não finalizado
        error:
          type: 'null'
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cabeçalho de autenticação Bearer no formato `Bearer <token>` onde `<token>` é seu TOKEN de autenticação